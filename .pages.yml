media:
  input: static/article-images
  output: /article-images
content:
  - name: blog
    label: Blog posts
    type: collection
    path: blog
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date]
      sort: [date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Summary, type: text }
      - name: tags
        label: Category
        type: select
        options:
          multiple: true
          values: [Blog posts, Feature announcements, In the news, Policy briefs, User guides]
      - name: authors
        label: Authors
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
      - { name: slug, label: Old duos.blog path, type: string, description: Leave empty for new articles }
      - { name: body, label: Body, type: rich-text }
